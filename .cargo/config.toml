[build]
# sccache is opt-in via RUSTC_WRAPPER env var (set by setup-compiler-gate action
# which installs sccache). Hardcoding rustc-wrapper here breaks jobs that don't
# install sccache (runtime-kit matrix on Windows/macOS).

# Shared target dir across git worktrees (set per-worktree via env if you prefer isolation).
# Uncomment to share: CARGO_TARGET_DIR is not a config key; document in justfile instead.

[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-apple-darwin]
# rust-lld ships with the toolchain and is the supported Darwin linker; mold is Linux-only here.
linker = "rust-lld"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
