[workspace]
resolver = "3"
members = ["crates/beskid_analysis", "crates/beskid_artifacts", "crates/beskid_cli", "crates/beskid_template", "crates/beskid_tests", "crates/beskid_e2e_tests", "crates/beskid_ast_derive", "crates/beskid_ast_reflect_gen", "crates/beskid_codegen", "crates/beskid_abi", "crates/beskid_pipeline", "crates/beskid_runtime", "crates/beskid_runtime_bridge", "crates/beskid_engine", "crates/abfall", "crates/beskid_lsp", "crates/beskid_aot", "crates/beskid_pckg", "crates/beskid_queries", "crates/beskid_graph"]
[workspace.dependencies]
salsa = { version = "0.26", features = ["macros", "persistence"] }
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }
enum-map = { version = "2.7", default-features = false }
hashbrown = { version = "0.16", default-features = false }
indexmap = { version = "2.13", default-features = false }
semver = "1"
abfall = { path = "crates/abfall" }
pest = "2.8"
pest_derive = "2.8"
pest-ast = "0.3.3"
from-pest = "0.3.3"
proc-macro2 = "1.0.56"
quote = "1.0.26"
rand = "0.8"
slotmap = { version = "1.1", default-features = false }
smallvec = { version = "1.15", default-features = false }
syn = { version = "2.0.17", features = ["default", "visit-mut"] }
synstructure = "0.13"
tracing = { version = "0.1.37", default-features = false }
trybuild = "1.0"
beskid_template = { path = "crates/beskid_template" }
mermaid-builder = "0.1.2"
graphs-tui = "0.4.0"
beskid_graph = { path = "crates/beskid_graph" }
beskid_artifacts = { path = "crates/beskid_artifacts" }
postcard = "1"

cranelift-codegen = "0.128.3"
cranelift-frontend = "0.128.3"
cranelift-jit = "0.128.3"
cranelift-module = "0.128.3"
cranelift-native = "0.128.3"
cranelift-object = "0.128.3"
