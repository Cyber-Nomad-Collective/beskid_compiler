[workspace]
resolver = "3"
members = ["crates/beskid_analysis", "crates/beskid_artifacts", "crates/beskid_cli", "crates/beskid_hi", "crates/beskid_tools", "crates/beskid_template", "crates/beskid_e2e_tests", "crates/beskid_ast_derive", "crates/beskid_ast_reflect_gen", "crates/beskid_codegen", "crates/beskid_abi", "crates/beskid_manifest", "crates/beskid_pipeline", "crates/beskid_engine", "crates/beskid_isle", "crates/abfall", "crates/beskid_lsp", "crates/beskid_repl", "crates/beskid_aot", "crates/beskid_pckg", "crates/beskid_pckg_artifacts", "crates/beskid_pckg_contract", "crates/beskid_pckg_auth", "crates/beskid_pckg_operations", "crates/beskid_pckg_server", "crates/beskid_pckg_store", "crates/beskid_queries", "crates/beskid_graph", "crates/beskid_pest_gen", "crates/beskid_up", "crates/beskid_tests_surface", "crates/beskid_tests_projects", "crates/beskid_tests_mods", "crates/beskid_tests_lsp", "crates/beskid_tests_aot", "crates/beskid_tests_pckg", "crates/beskid_tests_interop", "crates/beskid_tests_cli", "crates/beskid_tests_composition", "crates/beskid_tests_abi", "crates/beskid_tests_support"]
# Default members exclude the test sink crates (beskid_e2e_tests and the per-domain
# beskid_tests_* suites) so bare `cargo check` / `cargo build` iterate only on compiler
# crates. Run tests explicitly, e.g.:
#   cargo test -p beskid_tests_projects -p beskid_tests_surface -p beskid_e2e_tests
default-members = [
  "crates/beskid_analysis", "crates/beskid_artifacts", "crates/beskid_cli",
  "crates/beskid_hi", "crates/beskid_tools", "crates/beskid_template",
  "crates/beskid_ast_derive", "crates/beskid_ast_reflect_gen", "crates/beskid_codegen",
  "crates/beskid_abi", "crates/beskid_manifest", "crates/beskid_pipeline",
  "crates/beskid_engine", "crates/beskid_isle", "crates/abfall",
  "crates/beskid_lsp", "crates/beskid_repl", "crates/beskid_aot",
  "crates/beskid_pckg", "crates/beskid_pckg_artifacts", "crates/beskid_pckg_contract", "crates/beskid_pckg_auth", "crates/beskid_pckg_operations",
  "crates/beskid_pckg_server", "crates/beskid_pckg_store", "crates/beskid_queries",
  "crates/beskid_graph", "crates/beskid_pest_gen", "crates/beskid_up",
]

[workspace.lints.rust]
unsafe_code = "allow"
unused_must_use = "warn"

[workspace.lints.clippy]
enum_glob_use = "warn"

[workspace.dependencies]
salsa = { version = "0.26", features = ["macros", "persistence"] }
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }
enum-map = { version = "2.7", default-features = false }
hashbrown = { version = "0.16", default-features = false }
indexmap = { version = "2.13", default-features = false }
semver = "1"
abfall = { path = "crates/abfall" }
bsol = { path = "../beskid_bsol/crates/bsol" }
bsol-beskid-bridge = { path = "../beskid_bsol/crates/bsol-beskid-bridge" }
pest = "2.8"
pest_derive = "2.8"
pest-ast = "0.3.3"
from-pest = "0.3.3"
proc-macro2 = "1.0.56"
quote = "1.0.26"
rand = "0.8"
slotmap = { version = "1.1", default-features = false }
smallvec = { version = "1.15", default-features = false }
syn = { version = "2.0.17", features = ["default", "visit-mut"] }
synstructure = "0.13"
tracing = { version = "0.1.37", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
beskid_template = { path = "crates/beskid_template" }
graphs-tui = "0.4.0"
beskid_graph = { path = "crates/beskid_graph" }
beskid_artifacts = { path = "crates/beskid_artifacts" }
postcard = "1"
ratatui = { version = "0.30.1", features = ["crossterm"] }
ratatui-explorer = { version = "0.3", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.2"
crossterm = "0.29"
tui-tree-widget = "0.24"
tui-piechart = "0.3"
tui-logger = { version = "0.18", features = ["tracing-support"] }
tui-spinner = "0.2"
tui-term = "0.3.4"
workflow-core = { version = "0.19", default-features = false }
workflow-task = { version = "0.19", default-features = false }
panes = "0.21"
panes-ratatui = "0.5"
ratatui-code-editor = "0.0.4"
tachyonfx = "0.25"
ratkit = { path = "vendor/ratkit", default-features = false }
tuirealm = { version = "4.1.0", default-features = false, features = ["crossterm"] }

cranelift-codegen = "0.128.3"
cranelift-frontend = "0.128.3"
cranelift-isle = "0.128.3"
cranelift-jit = "0.128.3"
cranelift-module = "0.128.3"
cranelift-native = "0.128.3"
cranelift-object = "0.128.3"
cargo-cross = { path = "vendor/cargo-cross-patched" }

# --- Build profiles (consolidated here; Cargo only reliably reads [profile]
#     from Cargo.toml, not .cargo/config.toml) ---

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 16
debug = "line-tables-only"
strip = "symbols"
panic = "abort"
