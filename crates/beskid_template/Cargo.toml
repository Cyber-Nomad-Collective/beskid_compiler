[package]
name = "beskid_template"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
globset = "0.4"
regex = "1"
semver = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "2"
