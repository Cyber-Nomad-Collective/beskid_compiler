[package]
name = "beskid_artifacts"
version = "0.1.0"
edition = "2024"
description = "On-disk unit artifact cache schema and persistence for Beskid incremental compilation"

[dependencies]
beskid_pipeline = { path = "../beskid_pipeline" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
