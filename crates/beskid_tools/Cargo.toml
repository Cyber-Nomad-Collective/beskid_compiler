[package]
name = "beskid_tools"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
beskid_analysis = { path = "../beskid_analysis" }
beskid_pipeline = { path = "../beskid_pipeline" }
beskid_queries = { path = "../beskid_queries" }
beskid_pckg = { path = "../beskid_pckg" }
anyhow = "1.0"
include_dir = "0.7.4"
ratatui = { workspace = true }
crossterm = { workspace = true }
tui-tree-widget = { workspace = true }
tui-widget-list = { workspace = true }
tui-piechart = { workspace = true }
tui-logger = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
log = "0.4"
miette = { version = "7.1", features = ["fancy"] }
pest = { workspace = true }
semver = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
