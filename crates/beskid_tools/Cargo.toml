[package]
name = "beskid_tools"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
beskid_abi = { path = "../beskid_abi" }
beskid_aot = { path = "../beskid_aot" }
beskid_analysis = { path = "../beskid_analysis" }
bsol = { workspace = true }
beskid_pipeline = { path = "../beskid_pipeline" }
beskid_queries = { path = "../beskid_queries" }
beskid_pckg = { path = "../beskid_pckg" }
anyhow = "1.0"
include_dir = "0.7.4"
ratatui = { workspace = true, optional = true }
panes = { workspace = true, optional = true }
panes-ratatui = { workspace = true, optional = true }
ratatui-explorer = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
ratkit = { workspace = true, optional = true, features = ["pane", "tree-view", "dialog", "hotkey-footer", "hotkey-service", "widget-event", "resizable-grid"] }
tuirealm = { workspace = true, optional = true }
tui-piechart = { workspace = true, optional = true }
tui-logger = { workspace = true, optional = true }
tui-spinner = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
log = "0.4"
miette = { version = "7.1", features = ["fancy"] }
pest = { workspace = true }
semver = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
ratatui-code-editor = { workspace = true, optional = true }
tachyonfx = { workspace = true, optional = true, features = ["sendable"] }
workflow-core = { workspace = true }
workflow-task = { workspace = true }
async-channel = "2"
dirs = "6"
zip = "2"

[features]
tui = [
    "dep:ratatui",
    "dep:panes",
    "dep:panes-ratatui",
    "dep:ratatui-explorer",
    "dep:crossterm",
    "dep:ratkit",
    "dep:tuirealm",
    "dep:tui-piechart",
    "dep:tui-logger",
    "dep:tui-spinner",
    "dep:ratatui-code-editor",
    "dep:tachyonfx",
]
default = ["tui"]
