[package]
name = "beskid_tools"
version = "0.1.0"
edition = "2024"
license.workspace = true
build = "build.rs"

[dependencies]
beskid_abi = { path = "../beskid_abi" }
beskid_aot = { path = "../beskid_aot" }
beskid_analysis = { path = "../beskid_analysis" }
beskid_pipeline = { path = "../beskid_pipeline" }
beskid_queries = { path = "../beskid_queries" }
beskid_telemetry = { path = "../beskid_telemetry" }
beskid_pckg = { path = "../beskid_pckg" }
anyhow = "1.0"
include_dir = "0.7.4"
crossterm = { workspace = true }
tracing = { workspace = true, features = ["std"] }
miette = { version = "7.1", features = ["fancy"] }
pest = { workspace = true }
semver = { workspace = true }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
