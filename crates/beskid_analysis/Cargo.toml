[package]
name = "beskid_analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = { workspace = true }
pest_derive = { workspace = true }

beskid_ast_derive = { path = "../beskid_ast_derive" }
beskid_pipeline = { path = "../beskid_pipeline" }
miette = { version = "7.1", features = ["fancy"] }
thiserror = "2.0"
daggy = "0.9.0"
anyhow = "1"
log = "0.4"
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { workspace = true }
beskid_abi = { path = "../beskid_abi" }
beskid_artifacts = { path = "../beskid_artifacts" }
bsol = { workspace = true }
rayon = "1.10"
zip = "2"

[build-dependencies]
beskid_manifest = { path = "../beskid_manifest" }
