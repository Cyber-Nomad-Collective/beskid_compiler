[package]
name = "beskid_up"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "beskid-up"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
semver = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cargo-cross = { workspace = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
