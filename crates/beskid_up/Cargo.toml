[package]
name = "beskid_up"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "beskid-up"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
semver = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cargo-cross = { workspace = true }
thiserror = "2"
beskid_abi = { path = "../beskid_abi" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
