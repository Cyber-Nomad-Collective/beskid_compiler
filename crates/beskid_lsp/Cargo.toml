[package]
name = "beskid_lsp"
version = "0.6.7"
edition = "2024"
license.workspace = true

[[bin]]
name = "beskid_lsp"
path = "src/main.rs"

[dependencies]
beskid_analysis = { path = "../beskid_analysis" }
beskid_graph = { path = "../beskid_graph" }
beskid_queries = { path = "../beskid_queries", features = ["persistence"] }
beskid_tools = { path = "../beskid_tools" }
beskid_corelib_embed = { path = "../beskid_corelib_embed" }
bsol = { workspace = true }
pest = { workspace = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-std", "sync", "fs", "time"] }
tower-lsp-server = "0.23.0"
tower-service = "0.3"
serde_json = "1"
tracing = "0.1"
url = "2.5"
walkdir = "2.5"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
salsa = { workspace = true }
futures-util = "0.3"

# `kill(pid, 0)` for the client-process watch (every Unix); `mallopt` on Linux glibc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
beskid_tests_mod_host = { path = "../beskid_tests_mod_host" }
tempfile = "3"
# Paused virtual time for the scan-schedule tests (no wall-clock assertions).
tokio = { version = "1.48", features = ["test-util"] }
