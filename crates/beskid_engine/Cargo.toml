[package]
name = "beskid_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
cranelift-codegen = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
cranelift-object = { workspace = true }
beskid_analysis = { path = "../beskid_analysis" }
beskid_abi = { path = "../beskid_abi" }
beskid_aot = { path = "../beskid_aot" }
beskid_codegen = { path = "../beskid_codegen" }
beskid_queries = { path = "../beskid_queries" }
beskid_pipeline = { path = "../beskid_pipeline" }
anyhow = "1"

[features]
extern_dlopen = []

[dev-dependencies]
beskid_aot = { path = "../beskid_aot" }
beskid_runtime = { path = "../beskid_runtime", features = ["metrics"] }
tempfile = "3"
