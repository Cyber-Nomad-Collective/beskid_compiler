[package]
name = "beskid_queries"
version = "0.1.0"
edition = "2024"

[features]
# Opt-in Salsa snapshot serialization. Off by default — dev builds compile salsa
# without the `persistence` feature to save build time. Enable on release/persistence
# paths that need cross-run Salsa snapshot load/save.
default = []
persistence = ["salsa/persistence"]

[dependencies]
beskid_analysis = { path = "../beskid_analysis" }
beskid_abi = { path = "../beskid_abi" }
beskid_artifacts = { path = "../beskid_artifacts" }
beskid_graph = { path = "../beskid_graph" }
beskid_pipeline = { path = "../beskid_pipeline" }
salsa = { workspace = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2.0"
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
