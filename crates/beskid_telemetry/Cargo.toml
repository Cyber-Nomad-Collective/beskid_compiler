[package]
name = "beskid_telemetry"
version = "0.1.0"
edition = "2024"
description = "OpenTelemetry-compatible tracing for the Beskid compiler workspace"

[dependencies]
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-log = { workspace = true }
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.32"
tui-logger = { workspace = true, optional = true }

[features]
default = []
tui = ["dep:tui-logger"]
