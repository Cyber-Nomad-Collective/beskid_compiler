[package]
edition = "2021"
name = "cargo-cross"
version = "1.5.1"
authors = ["pyh1670605849@gmail.com"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A cargo subcommand for cross-compilation, no need docker!"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zijiren233/cargo-cross"

[lib]
name = "cargo_cross"
path = "src/lib.rs"

[[bin]]
name = "cargo-cross"
path = "src/main.rs"

[[test]]
name = "help_output"
path = "tests/help_output.rs"

[dependencies.async-compression]
version = "0.4"
features = [
    "tokio",
    "gzip",
]
default-features = false

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
]

[dependencies.colored]
version = "3"

[dependencies.futures-util]
version = "0.3"

[dependencies.globset]
version = "0.4"
default-features = false

[dependencies.indicatif]
version = "0.18"

[dependencies.path-slash]
version = "0.2"

[dependencies.regex-lite]
version = "0.1"

[dependencies.serde_json]
version = "1"

[dependencies.shlex]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "rt",
    "macros",
    "process",
    "signal",
]

[dependencies.tokio-tar]
version = "0.6"
default-features = false
package = "astral-tokio-tar"

[dependencies.tokio-util]
version = "0.7"
features = ["io"]

[dependencies.which]
version = "8"

[dependencies.zip]
version = "8"
features = ["deflate"]
default-features = false

[dev-dependencies.tokio-test]
version = "0.4"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies.reqwest]
version = "0.13"
features = [
    "stream",
    "native-tls",
    "system-proxy",
]
default-features = false

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies.reqwest]
version = "0.13"
features = [
    "stream",
    "rustls",
    "system-proxy",
]
default-features = false

[target."cfg(unix)".dependencies.nix]
version = "0.31"
features = [
    "process",
    "signal",
]

[profile.dev]
opt-level = 0
lto = "off"
debug = 0
debug-assertions = false
panic = "abort"
overflow-checks = false
strip = "symbols"

[profile.release]
opt-level = "z"
lto = "thin"
debug = 0
debug-assertions = false
panic = "abort"
overflow-checks = false
strip = "symbols"
